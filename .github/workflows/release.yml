name: Create Release

on:
  push:
    # CLI releases only: a cli-v<CLI semver> tag publishes @xmemo/client to npm.
    tags:
      - 'cli-v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned npm for Trusted Publishing (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.4
          npm --version
      
      - name: Install dependencies
        run: npm ci

      - name: Verify tag and release metadata
        run: node scripts/check-release-version.mjs --channel cli --tag "${{ github.ref_name }}"

      - name: Run package gate
        run: |
          npm run lint
          npm test
          npm run pack:dry-run
      
      - name: Publish to npm
        run: npm publish --access public --provenance
      
      - name: Create GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#cli-v}"
          gh release create "$TAG" \
            --verify-tag \
            --title "XMemo CLI v${VERSION}" \
            --latest=false \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Package XMemo Skill release assets

on:
  release:
    # Only skill-v<Skill semver> releases are packaged by the job gate below.
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published Release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    # Keep CLI v<CLI semver> npm releases and Skill releases independent.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'skill-v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'skill-v'))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      XMEMO_BASE_URL: https://xmemo.dev
    steps:
      - name: Validate Skill Release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^skill-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skill releases must use a skill-v<major>.<minor>.<patch> tag; got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Verify tag matches Skill source version
        shell: bash
        run: |
          set -euo pipefail
          skill_version="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('skills/xmemo/scripts/xmemo-skill.mjs', 'utf8');
          const version = source.match(/const SKILL_VERSION = '([^']+)'/)?.[1];
          if (!version) throw new Error('SKILL_VERSION was not found in the checked-out Skill source');
          console.log(version);
          NODE
          )"
          expected_tag="skill-v$skill_version"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Skill Release tag $RELEASE_TAG does not match source version $skill_version; expected $expected_tag" >&2
            exit 1
          fi

      - name: Build verified Skill archives
        shell: bash
        run: |
          set -euo pipefail

          source_dir="skills/xmemo"
          artifact_dir="$GITHUB_WORKSPACE/release-assets"
          staging_dir="$(mktemp -d)"
          tar_extract_dir="$(mktemp -d)"
          zip_extract_dir="$(mktemp -d)"
          trap 'rm -rf "$staging_dir" "$tar_extract_dir" "$zip_extract_dir"' EXIT

          test -f "$source_dir/scripts/xmemo-skill.mjs"
          mkdir -p "$artifact_dir"

          # Do not package symlinks: they could point outside the Skill root and
          # their target bytes would not be reliably identical across formats.
          if find "$source_dir" -type l -print -quit | grep -q .; then
            echo "Refusing to package symlinks from $source_dir" >&2
            exit 1
          fi

          is_sensitive_name() {
            local name="${1,,}"
            [[ "$name" == .env || "$name" == .env.* || "$name" == *secret* || "$name" == *token* || "$name" == *key* || "$name" == *credential* ]]
          }

          while IFS= read -r -d '' source_file; do
            relative_path="${source_file#"$source_dir"/}"
            filename="${relative_path##*/}"
            if is_sensitive_name "$filename"; then
              echo "Excluding sensitive-looking file: $relative_path"
              continue
            fi
            destination="$staging_dir/$relative_path"
            mkdir -p "$(dirname "$destination")"
            cp --preserve=mode,timestamps -- "$source_file" "$destination"
          done < <(find "$source_dir" -type f -print0 | LC_ALL=C sort -z)

          test -f "$staging_dir/scripts/xmemo-skill.mjs"
          if ! find "$staging_dir" -type f -print -quit | grep -q .; then
            echo "No files were eligible for packaging" >&2
            exit 1
          fi

          tar --create --gzip --file="$artifact_dir/xmemo-skill.tar.gz" --directory="$staging_dir" .
          (
            cd "$staging_dir"
            zip --quiet --recurse-paths "$artifact_dir/xmemo-skill.zip" .
          )

          tar --extract --gzip --file="$artifact_dir/xmemo-skill.tar.gz" --directory="$tar_extract_dir"
          unzip -q "$artifact_dir/xmemo-skill.zip" -d "$zip_extract_dir"
          diff --recursive --no-dereference "$tar_extract_dir" "$zip_extract_dir"

          for extracted_dir in "$tar_extract_dir" "$zip_extract_dir"; do
            test -f "$extracted_dir/scripts/xmemo-skill.mjs"
            # The installers live in skills/ (outside the Skill root) because their
            # job is to download this archive; they must never ship inside it.
            test ! -e "$extracted_dir/install.sh"
            test ! -e "$extracted_dir/install.ps1"
            while IFS= read -r -d '' extracted_file; do
              if is_sensitive_name "${extracted_file##*/}"; then
                echo "Sensitive-looking file found in archive: $extracted_file" >&2
                exit 1
              fi
            done < <(find "$extracted_dir" -type f -print0)
          done

      - name: Upload archives to this Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/xmemo-skill.tar.gz \
            release-assets/xmemo-skill.zip \
            --clobber

      - name: Notify xmemo.dev after assets are available
        env:
          GH_TOKEN: ${{ github.token }}
          XMEMO_SKILL_RELEASE_WEBHOOK_SECRET: ${{ secrets.XMEMO_SKILL_RELEASE_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$XMEMO_SKILL_RELEASE_WEBHOOK_SECRET" ]]; then
            echo "Missing required repository secret: XMEMO_SKILL_RELEASE_WEBHOOK_SECRET" >&2
            exit 1
          fi

          release_json="$(mktemp)"
          webhook_payload="$(mktemp)"
          response_body="$(mktemp)"
          trap 'rm -f "$release_json" "$webhook_payload" "$response_body"' EXIT

          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"

          # Announce only the fields the receiver reads. Release notes and other
          # free-form text must stay out of the request body: forwarding a whole
          # release object made the announcement depend on how the notes were
          # worded, and a body containing a shell pipeline was rejected by the
          # receiver's edge protection with HTTP 403.
          node --input-type=module - "$release_json" "$webhook_payload" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const [releasePath, outputPath] = process.argv.slice(2);
          const release = JSON.parse(readFileSync(releasePath, 'utf8'));

          const tagName = release.tag_name;
          if (typeof tagName !== 'string' || tagName === '') {
            throw new Error('release.tag_name is missing from the release metadata');
          }

          const assets = (release.assets ?? []).map((asset) => ({
            name: asset.name,
            browser_download_url: asset.browser_download_url,
          }));
          if (assets.length === 0) {
            throw new Error('the release has no assets to announce');
          }

          writeFileSync(
            outputPath,
            JSON.stringify({ action: 'published', release: { tag_name: tagName, assets } }),
          );
          NODE

          signature="sha256=$(openssl dgst -sha256 -hmac "$XMEMO_SKILL_RELEASE_WEBHOOK_SECRET" -hex < "$webhook_payload" | sed 's/^.* //')"

          # A 4xx answer will not become a 2xx on retry, so it is reported at
          # once instead of being retried until the step times out.
          attempt=1
          max_attempts=3
          while :; do
            http_code="$(curl --silent --show-error --output "$response_body" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Event: release' \
              --header "X-Hub-Signature-256: $signature" \
              --data-binary "@$webhook_payload" \
              "$XMEMO_BASE_URL/v1/skill/package/webhook" || true)"
            case "$http_code" in
              2*)
                echo "Announcement accepted: HTTP $http_code"
                break
                ;;
              4*)
                echo "Announcement rejected with HTTP $http_code; not retrying." >&2
                head -c 500 "$response_body" >&2 || true
                echo >&2
                exit 1
                ;;
              *)
                if [[ "$attempt" -ge "$max_attempts" ]]; then
                  echo "Announcement failed after $attempt attempts (last status: ${http_code:-none})." >&2
                  head -c 500 "$response_body" >&2 || true
                  echo >&2
                  exit 1
                fi
                echo "Announcement attempt $attempt failed (status: ${http_code:-none}); retrying." >&2
                sleep "$((attempt * 3))"
                attempt=$((attempt + 1))
                ;;
            esac
          done

      - name: Verify xmemo.dev serves this release
        shell: bash
        run: |
          set -euo pipefail

          # The announcement only queues a refresh, so the release is not done
          # until the public endpoint actually serves this tag. The package cache
          # has no expiry of its own, so an announcement that was rejected or
          # dropped would otherwise keep the previous Skill published
          # indefinitely, with nothing failing to show it.
          deadline=$((SECONDS + 300))

          for format in tar.gz zip; do
            while :; do
              location="$(curl --silent --show-error --output /dev/null --dump-header - \
                "$XMEMO_BASE_URL/v1/skill/package?format=$format" \
                | tr -d '\r' | sed -n 's/^[Ll]ocation:[[:space:]]*//p' | tail -n 1 || true)"

              if [[ "$location" == *"/$RELEASE_TAG" ]]; then
                echo "$format: serving $location"
                break
              fi

              if (( SECONDS >= deadline )); then
                echo "$format: $XMEMO_BASE_URL still does not serve $RELEASE_TAG." >&2
                echo "$format: last redirect target was ${location:-none}." >&2
                echo "A missing redirect can also mean the endpoint answered without a cached artifact." >&2
                exit 1
              fi

              sleep 10
            done
          done

# Note: Manual recovery publishing via this workflow requires its own Trusted Publisher
# entry configured on npmjs.com (@xmemo/client: workflow publish.yml, environment npm).
# Until that trusted publisher entry is configured, manual runs of this workflow will
# fail with an npm authentication error by design.

name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing CLI release tag to recover, for example cli-v0.4.181
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned npm for Trusted Publishing (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.4
          npm --version
      - run: npm ci
      - run: node scripts/check-release-version.mjs --channel cli --tag "${{ inputs.ref }}"
      - run: npm run lint
      - run: npm test
      - run: npm run pack:dry-run
      - run: npm publish --access public --provenance
